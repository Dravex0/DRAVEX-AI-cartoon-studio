name: DRAVEX Playwright browser tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --no-audit --no-fund --onnxruntime-node-install-cuda=skip

      - name: Install portable FFmpeg and ffprobe for browser video checks
        run: |
          npm install --no-save --package-lock=false ffmpeg-static @ffprobe-installer/linux-x64
          FFMPEG_PATH="$(node -e "process.stdout.write(require('ffmpeg-static'))")"
          FFPROBE_PATH="$(node -e "process.stdout.write(require('@ffprobe-installer/linux-x64').path)")"
          test -x "$FFMPEG_PATH"
          test -x "$FFPROBE_PATH"
          mkdir -p "$RUNNER_TEMP/dravex-media-tools"
          ln -sf "$FFMPEG_PATH" "$RUNNER_TEMP/dravex-media-tools/ffmpeg"
          ln -sf "$FFPROBE_PATH" "$RUNNER_TEMP/dravex-media-tools/ffprobe"
          echo "$RUNNER_TEMP/dravex-media-tools" >> "$GITHUB_PATH"
          ffmpeg -version
          ffprobe -version

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run existing unit tests
        run: npm test

      - name: Run desktop and Pixel 7 browser tests against the source build
        run: npx playwright test --grep-invert "DRAVEX live Pages"

      - name: Run the free QA agent against the published GitHub Pages site
        run: npx playwright test tests/e2e/dravex-live-pages-qa.spec.js

      - name: Preserve live Pages QA video and frame evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dravex-live-pages-qa-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run the broad published Pages feature matrix
        run: npx playwright test tests/e2e/dravex-live-feature-matrix.spec.js

      - name: Upload Playwright report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dravex-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
