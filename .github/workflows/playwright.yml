name: DRAVEX Playwright browser tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      real_piper:
        description: Download real Ukrainian Piper weights (~76.7 MB) and synthesize three test voices
        required: false
        type: boolean
        default: false
      real_russian_vits:
        description: Download real Russian VITS weights (~50.8 MB), synthesize two voices and verify final WebM audio
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --no-audit --no-fund --onnxruntime-node-install-cuda=skip

      - name: Install portable FFmpeg and ffprobe for browser video checks
        run: |
          npm install --no-save --package-lock=false ffmpeg-static @derhuerst/ffprobe-static
          FFMPEG_PATH="$(node -e "process.stdout.write(require('ffmpeg-static'))")"
          FFPROBE_PATH="$(node -e "process.stdout.write(require('@derhuerst/ffprobe-static'))")"
          test -x "$FFMPEG_PATH"
          test -x "$FFPROBE_PATH"
          mkdir -p "$RUNNER_TEMP/dravex-media-tools"
          ln -sf "$FFMPEG_PATH" "$RUNNER_TEMP/dravex-media-tools/ffmpeg"
          ln -sf "$FFPROBE_PATH" "$RUNNER_TEMP/dravex-media-tools/ffprobe"
          echo "$RUNNER_TEMP/dravex-media-tools" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/dravex-media-tools:$PATH"
          ffmpeg -version
          ffprobe -version

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run existing unit tests
        run: npm test

      - name: Run desktop and Pixel 7 browser tests against the source build
        run: npx playwright test --grep-invert "DRAVEX live Pages"

      - name: Run the free QA agent against the published GitHub Pages site
        run: npx playwright test tests/e2e/dravex-live-pages-qa.spec.js

      - name: Preserve live Pages QA video and frame evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dravex-live-pages-qa-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run the broad published Pages feature matrix
        run: npx playwright test tests/e2e/dravex-live-feature-matrix.spec.js

      - name: Build local ONNX WASM assets for real Piper smoke
        if: (github.event_name == 'workflow_dispatch' && inputs.real_piper) || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'test/piper-real-weights-smoke-20261115')
        run: npm run build

      - name: Run opt-in real Piper weights inference test
        if: (github.event_name == 'workflow_dispatch' && inputs.real_piper) || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'test/piper-real-weights-smoke-20261115')
        env:
          DRAVEX_REAL_PIPER: "1"
        run: npx playwright test tests/e2e/piper-real-inference.spec.js --project=chromium-desktop --workers=1

      - name: Build local ONNX WASM assets for real Russian VITS smoke
        if: (github.event_name == 'workflow_dispatch' && inputs.real_russian_vits) || (github.event_name == 'pull_request' && (github.event.pull_request.head.ref == 'feat/russian-vits-two-speaker-local-tts-20261115' || github.event.pull_request.head.ref == 'test/russian-vits-webm-export-20261116'))
        run: npm run build

      - name: Run real Russian VITS weights inference test on Desktop Chromium
        if: (github.event_name == 'workflow_dispatch' && inputs.real_russian_vits) || (github.event_name == 'pull_request' && (github.event.pull_request.head.ref == 'feat/russian-vits-two-speaker-local-tts-20261115' || github.event.pull_request.head.ref == 'test/russian-vits-webm-export-20261116'))
        env:
          DRAVEX_REAL_RUSSIAN_VITS: "1"
        run: npx playwright test tests/e2e/russian-vits-real-inference.spec.js --project=chromium-desktop --workers=1

      - name: Run real Russian VITS weights inference test on Pixel 7 profile
        if: (github.event_name == 'workflow_dispatch' && inputs.real_russian_vits) || (github.event_name == 'pull_request' && (github.event.pull_request.head.ref == 'feat/russian-vits-two-speaker-local-tts-20261115' || github.event.pull_request.head.ref == 'test/russian-vits-webm-export-20261116'))
        env:
          DRAVEX_REAL_RUSSIAN_VITS: "1"
        run: npx playwright test tests/e2e/russian-vits-real-inference.spec.js --project=chromium-pixel-7 --workers=1

      - name: Upload Playwright report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dravex-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
