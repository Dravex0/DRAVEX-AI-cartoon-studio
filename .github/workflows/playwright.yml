name: DRAVEX Playwright browser tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --no-audit --no-fund --onnxruntime-node-install-cuda=skip

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run existing unit tests
        run: npm test

      - name: Run desktop and Pixel 7 browser tests
        run: npm run test:e2e
        env:
          # Optional secret: enables the real, quota-consuming Wan 2.2 smoke tests.
          # Never echo or otherwise expose this value in logs.
          DRAVEX_HF_TOKEN: ${{ secrets.DRAVEX_HF_TOKEN }}

      - name: Upload Playwright report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dravex-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
