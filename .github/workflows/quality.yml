name: DX Studio quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run storyboard QA tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Upload production bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dx-studio-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
